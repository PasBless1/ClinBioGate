defaults: configs/data.yaml

experiment:
  name: baseline_clinical
  description: "Model A - clinical-only MLP (BCVA, CST + missingness indicators)"

model:
  name: clinical_only
  clinical_features: [bcva, cst]
  use_missingness_indicators: true
  clinical_embedding_dim: 32
  clinical_hidden_dims: [64, 32]
  dropout: 0.30

training:
  epochs: 100
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 15
  monitor: val_macro_auprc
  monitor_mode: max
  amp: false
  pos_weight: from_train_fold
  pos_weight_cap: 20.0

uncertainty:
  mc_dropout_passes: 30

evaluation:
  bootstrap_iterations: 1000
  threshold_strategy: per_label_validation_f1
