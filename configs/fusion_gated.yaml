defaults: configs/data.yaml

experiment:
  name: fusion_gated
  description: "Model D - proposed clinically gated fusion"

model:
  name: gated_fusion
  image_encoder: resnet18
  pretrained: true
  image_embedding_dim: 256
  clinical_features: [bcva, cst]
  use_missingness_indicators: true
  clinical_embedding_dim: 32
  clinical_hidden_dims: [64, 32]
  dropout: 0.30
  # Residual-safe gating: scale = 1 + alpha * (2 * gate - 1), applied as
  # gated_image = image * scale.
  # The gate's output weights are zeroed at init, so every sample gets
  # sigmoid(gate_bias_init). With gate_bias_init = 0 that is 0.5, giving
  # scale = 1 -> an exact identity pass-through of the OCT embedding, which the
  # model must then learn to move away from. Leave gate_bias_init null to let
  # ClinicalGate pick the identity-preserving value for the chosen mode
  # (0.0 residual, 4.0 non-residual).
  gate_residual: true
  gate_bias_init: null
  gate_scale_alpha: 1.0

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 8
  monitor: val_macro_auprc
  monitor_mode: max
  amp: true
  pos_weight: from_train_fold
  pos_weight_cap: 20.0

uncertainty:
  mc_dropout_passes: 30

evaluation:
  bootstrap_iterations: 1000
  threshold_strategy: per_label_validation_f1
