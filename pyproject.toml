[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olives-biomarkers"
version = "0.1.0"
description = "Clinically grounded, uncertainty-aware multimodal retinal biomarker detection on OLIVES"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Blessing Asare" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch>=2.0",
    "torchvision>=0.15",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "ipykernel>=6.29", "jupyter>=1.0"]
extra = ["iterative-stratification>=0.1.7", "umap-learn>=0.5", "imagehash>=4.3"]

[project.scripts]
olives = "olives_biomarkers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
